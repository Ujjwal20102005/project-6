apiVersion: apps/v1
kind: Deployment
metadata: { name: ecommerce-api, labels: { app: ecommerce-api } }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: ecommerce-api } }
  template:
    metadata:
      labels: { app: ecommerce-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: api
          image: ghcr.io/your-org/ecommerce-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: ecommerce-config } }]
          env:
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: secret-key } }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
