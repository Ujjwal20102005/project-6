services:
  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    ports: ["8000:8000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: sqlite:////data/app.db
    volumes: [appdata:/data]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
volumes:
  appdata:
