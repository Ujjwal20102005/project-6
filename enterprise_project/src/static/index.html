<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront</title>
<style>
:root{--bg:#eef2f4;--surface:#fff;--ink:#16202b;--muted:#5b6b7a;--line:#d5dde3;--accent:#0b6e63;--accent-ink:#fff;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--surface:#18222b;--ink:#e8eef2;--muted:#93a4b3;--line:#2b3946;--accent:#3cc2ae;--accent-ink:#06211d;--danger:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px max(16px,calc(50% - 560px));background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:1.35rem;margin:0;flex:1;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 12px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
.lead{margin:0 0 20px;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card .mark{height:96px;border-radius:6px;display:grid;place-items:center;font-size:2.4rem;font-weight:700;color:var(--accent-ink);background:var(--accent)}
.card h3{margin:8px 0 0;font-size:1.05rem}
.price{font-size:1.2rem;font-weight:700}
.stock{color:var(--muted);font-size:.9rem}
.stock.low{color:var(--danger)}
.card button{margin-top:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.95rem}
input{width:100%;font:inherit;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row.end{justify-content:flex-end;margin-top:16px}
.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty button{padding:2px 9px}
.total{font-size:1.2rem;font-weight:700;margin-top:12px;display:flex;justify-content:space-between}
.err{color:var(--danger);min-height:1.4em;margin:8px 0 0;font-size:.95rem}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 8px;margin-left:6px;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:20}
.empty{color:var(--muted);padding:24px 0}
.admin{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px;margin-bottom:24px}
.admin .row input{flex:1}
@media (prefers-reduced-motion:no-preference){#toast{animation:in .2s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header>
  <h1>Storefront</h1>
  <span id="who" class="stock"></span>
  <button id="ordersBtn" hidden>My orders</button>
  <button id="authBtn">Sign in</button>
  <button id="cartBtn">Cart<span class="badge" id="count">0</span></button>
</header>
<main>
  <p class="lead">Browse the catalogue, add items to your cart and check out. Sign in first to place an order.</p>
  <section id="admin" class="admin" hidden>
    <h2>Add a product</h2>
    <form id="addForm" class="row">
      <input id="pName" placeholder="Name" aria-label="Product name" required>
      <input id="pPrice" type="number" min="0.01" step="0.01" placeholder="Price (₹)" aria-label="Price" required>
      <input id="pStock" type="number" min="0" placeholder="Stock" aria-label="Stock" required>
      <button class="primary">Add product</button>
    </form>
  </section>
  <div id="products" class="grid" aria-live="polite"></div>
</main>

<dialog id="authDlg">
  <h2 id="authTitle">Sign in</h2>
  <form id="authForm">
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password (8+ characters)</label><input id="pw" type="password" minlength="8" autocomplete="current-password" required>
    <p class="err" id="authErr" role="alert"></p>
    <div class="row end">
      <button type="button" id="switchAuth">Create an account</button>
      <button type="button" id="closeAuth">Cancel</button>
      <button class="primary" id="authSubmit">Sign in</button>
    </div>
  </form>
</dialog>

<dialog id="cartDlg">
  <h2>Your cart</h2>
  <div id="cartBody"></div>
  <p class="err" id="cartErr" role="alert"></p>
  <div class="row end"><button id="closeCart">Keep shopping</button><button class="primary" id="checkout">Place order</button></div>
</dialog>

<dialog id="ordersDlg">
  <h2>My orders</h2>
  <div id="ordersBody"></div>
  <div class="row end"><button id="closeOrders">Close</button></div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const money = n => "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits: 2});
const S = {token: localStorage.getItem("token"), email: localStorage.getItem("email"), cart: {}, products: [], signup: false};

function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2600)}
function role(){try{return JSON.parse(atob(S.token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).role}catch{return null}}

async function api(path, opts = {}){
  const headers = {"Content-Type": "application/json"};
  if (S.token) headers.Authorization = "Bearer " + S.token;
  const r = await fetch(path, {...opts, headers});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && S.token && !path.startsWith("/auth")) { signOut(); throw new Error("Your session expired. Sign in again."); }
    const d = data.detail;
    throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : d || "Request failed");
  }
  return data;
}

function renderHeader(){
  const on = !!S.token;
  $("#authBtn").textContent = on ? "Sign out" : "Sign in";
  $("#who").textContent = on ? S.email : "";
  $("#ordersBtn").hidden = !on;
  $("#admin").hidden = role() !== "admin";
  $("#count").textContent = Object.values(S.cart).reduce((a, i) => a + i.q, 0);
}
function signOut(){S.token=S.email=null;localStorage.removeItem("token");localStorage.removeItem("email");renderHeader()}

async function loadProducts(){
  const box = $("#products");
  try { S.products = await api("/products?limit=500"); } catch(e){ box.innerHTML = '<p class="empty">Could not load products. Refresh to try again.</p>'; return; }
  if (!S.products.length) { box.innerHTML = '<p class="empty">No products yet. An admin can add the first one.</p>'; return; }
  box.replaceChildren(...S.products.map(p => {
    const c = document.createElement("article"); c.className = "card";
    const inCart = S.cart[p.id]?.q || 0, left = p.stock - inCart;
    c.innerHTML = '<div class="mark" aria-hidden="true"></div><h3></h3><div class="price"></div><div class="stock"></div><button class="primary">Add to cart</button>';
    c.querySelector(".mark").textContent = p.name.trim().charAt(0).toUpperCase();
    c.querySelector("h3").textContent = p.name;
    c.querySelector(".price").textContent = money(p.price);
    const st = c.querySelector(".stock"); st.textContent = p.stock === 0 ? "Out of stock" : p.stock + " in stock"; st.classList.toggle("low", p.stock < 5);
    const b = c.querySelector("button"); b.disabled = left <= 0;
    b.addEventListener("click", () => { addToCart(p); });
    return c;
  }));
}

function addToCart(p){
  const it = S.cart[p.id] ||= {p, q: 0};
  if (it.q < p.stock) it.q++;
  renderHeader(); loadProductsView(); toast(p.name + " added to cart");
}
const loadProductsView = () => loadProducts();

function renderCart(){
  const items = Object.values(S.cart).filter(i => i.q > 0), body = $("#cartBody");
  $("#cartErr").textContent = ""; $("#checkout").disabled = !items.length;
  if (!items.length) { body.innerHTML = '<p class="empty">Your cart is empty. Add something from the catalogue.</p>'; return; }
  body.replaceChildren(...items.map(i => {
    const d = document.createElement("div"); d.className = "line";
    d.innerHTML = '<span></span><span class="qty row"><button aria-label="Decrease">−</button><b></b><button aria-label="Increase">+</button></span>';
    d.firstChild.textContent = i.p.name + " · " + money(i.p.price);
    d.querySelector("b").textContent = i.q;
    const [minus, plus] = d.querySelectorAll("button");
    minus.onclick = () => { i.q--; if (i.q <= 0) delete S.cart[i.p.id]; renderCart(); renderHeader(); loadProducts(); };
    plus.onclick = () => { if (i.q < i.p.stock) i.q++; renderCart(); renderHeader(); loadProducts(); };
    return d;
  }));
  const t = document.createElement("div"); t.className = "total";
  t.innerHTML = "<span>Total</span><span></span>"; t.lastChild.textContent = money(items.reduce((a, i) => a + i.q * i.p.price, 0));
  body.append(t);
}

$("#cartBtn").onclick = () => { renderCart(); $("#cartDlg").showModal(); };
$("#closeCart").onclick = () => $("#cartDlg").close();
$("#checkout").onclick = async () => {
  if (!S.token) { $("#cartDlg").close(); openAuth(false); return; }
  const items = Object.values(S.cart).map(i => ({product_id: i.p.id, quantity: i.q}));
  try {
    const o = await api("/orders", {method: "POST", body: JSON.stringify({items})});
    S.cart = {}; renderHeader(); $("#cartDlg").close(); toast("Order #" + o.id + " placed · " + money(o.total)); loadProducts();
  } catch(e){ $("#cartErr").textContent = e.message; }
};

function openAuth(signup){
  S.signup = signup; $("#authTitle").textContent = $("#authSubmit").textContent = signup ? "Create account" : "Sign in";
  $("#switchAuth").textContent = signup ? "I have an account" : "Create an account";
  $("#authErr").textContent = ""; $("#authDlg").showModal();
}
$("#authBtn").onclick = () => S.token ? (signOut(), toast("Signed out")) : openAuth(false);
$("#switchAuth").onclick = () => openAuth(!S.signup);
$("#closeAuth").onclick = () => $("#authDlg").close();
$("#authForm").onsubmit = async e => {
  e.preventDefault();
  const body = JSON.stringify({email: $("#email").value, password: $("#pw").value});
  try {
    if (S.signup) await api("/auth/register", {method: "POST", body});
    const r = await api("/auth/login", {method: "POST", body});
    S.token = r.access_token; S.email = $("#email").value.toLowerCase();
    localStorage.setItem("token", S.token); localStorage.setItem("email", S.email);
    $("#authDlg").close(); $("#authForm").reset(); renderHeader(); toast("Signed in as " + S.email);
  } catch(err){ $("#authErr").textContent = err.message; }
};

$("#ordersBtn").onclick = async () => {
  const body = $("#ordersBody"); body.innerHTML = ""; $("#ordersDlg").showModal();
  try {
    const orders = await api("/orders");
    if (!orders.length) { body.innerHTML = '<p class="empty">No orders yet.</p>'; return; }
    body.replaceChildren(...orders.reverse().map(o => {
      const d = document.createElement("div"); d.className = "line";
      d.innerHTML = "<span></span><b></b>";
      d.firstChild.textContent = "Order #" + o.id + " · " + o.items.length + " item(s) · " + new Date(o.created_at).toLocaleDateString();
      d.lastChild.textContent = money(o.total); return d;
    }));
  } catch(e){ body.textContent = e.message; }
};
$("#closeOrders").onclick = () => $("#ordersDlg").close();

$("#addForm").onsubmit = async e => {
  e.preventDefault();
  try {
    await api("/products", {method: "POST", body: JSON.stringify({name: $("#pName").value, price: +$("#pPrice").value, stock: +$("#pStock").value})});
    e.target.reset(); toast("Product added"); loadProducts();
  } catch(err){ toast(err.message); }
};

renderHeader(); loadProducts();
</script>
</body>
</html>
